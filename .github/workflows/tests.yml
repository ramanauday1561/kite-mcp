name: Tests

on:
  push:
    # No branch filter: this repository's default branch is not named `main`,
    # and pinning to `main` silently stopped the matrix from ever running.
    paths: ['engine/**', 'tools/**', 'tests/**', 'requirements.txt', 'config.json']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Replay the learning loop end to end
        run: python -m tools.simulate --synthetic 320 --warmup 250
